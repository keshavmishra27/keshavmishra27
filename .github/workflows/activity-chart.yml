
name: Update Contribution Activity Chart

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution charts
        uses: dturovskiy/deus-commit-chart@v1
        with:
          username: keshavmishra27
          token: ${{ github.token }}
          default-days: "365"
          ranges: "30,90,365"
          layout: spacious
          output-dir: activity-dist

      - name: Publish generated charts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch activity-assets \
            https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git \
            published
          cp activity-dist/activity-*.svg published/
          cd published
          git add activity-*.svg
          git diff --cached --quiet || \
            git commit -m "Update contribution activity charts"
          git push
